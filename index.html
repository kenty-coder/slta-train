<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>言語訓練</title>
<style>
/* 言語訓練アプリ  作成：KENTA SHINKAWA */
:root{
  --fs:22px;
  --font:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo",sans-serif;
  --bg:#f5f4ef; --card:#fff; --ink:#1d1d1d; --sub:#5b5b5b; --line:#c9c6bd;
  --main:#1f4e79; --main2:#e7eef6; --ok:#1d5c3a; --ng:#8a2a1a; --warn:#fff4d6;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:var(--fs);line-height:1.6;-webkit-text-size-adjust:100%}
body.mincho{--font:"Hiragino Mincho ProN","Yu Mincho","YuMincho","BIZ UDMincho","MS Mincho",serif}
button,input,select,textarea{font:inherit;color:inherit}
button{min-height:64px;min-width:64px;padding:0 20px;border:2px solid #8f8b80;border-radius:12px;background:#fff;cursor:pointer;touch-action:manipulation}
button:active{transform:translateY(1px)}
button.p{background:var(--main);border-color:var(--main);color:#fff}
button.s{min-height:64px;font-size:.85em;padding:0 14px}
button.on{background:var(--main2);border-color:var(--main);box-shadow:inset 0 0 0 2px var(--main)}
button:disabled{opacity:.4;cursor:default}
input[type=text],input[type=date],input[type=number],select,textarea{min-height:56px;border:2px solid #9d998e;border-radius:10px;padding:6px 12px;background:#fff}
textarea{width:100%;min-height:140px;font-size:.75em;font-family:monospace}
.wrap{max-width:1100px;margin:0 auto;padding:12px 18px 40px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 18px;background:#fff;border-bottom:2px solid var(--line);position:sticky;top:0;z-index:5}
.top h1{font-size:1.15em;margin:0 8px 0 0}
.top .who{color:var(--sub);font-size:.85em;flex:1}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px 18px;margin:14px 0}
.card h2{font-size:1.05em;margin:0 0 10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid-btn{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.grid-btn button{min-height:84px;text-align:left;font-size:1em}
.grid-btn button small{display:block;color:var(--sub);font-size:.7em;line-height:1.4}
.grid-btn button.p small{color:#dfe8f2}
.muted{color:var(--sub);font-size:.85em}
.small{font-size:.8em}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{font-size:.8em;color:var(--sub);font-weight:normal}
.foot{color:var(--sub);font-size:.75em;text-align:center;padding:20px}
.err{color:var(--ng)}
.tag{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:0 8px;margin:2px 4px 2px 0;font-size:.8em;background:#faf9f5}
.tag.m{background:var(--main2);border-color:#a9bfd6}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#333;color:#fff;padding:12px 22px;border-radius:12px;display:none;z-index:50;font-size:.9em}
#errbar{position:fixed;left:0;right:0;top:0;background:#8a2a1a;color:#fff;padding:8px 14px;z-index:60;font-size:.75em;display:none;white-space:pre-wrap}
/* SLTA 入力 */
.slta-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:6px 18px}
.sl{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px dashed #ddd}
.sl .no{width:2em;color:var(--sub);font-size:.8em}
.sl .nm{flex:1;font-size:.9em}
.sl input{width:5.4em;text-align:right}
.sl .pc{width:3.6em;font-size:.8em;color:var(--sub);text-align:right}
.sl.bad input{border-color:var(--ng);background:#fff0ee}
.dom{margin:12px 0 4px;font-weight:bold;font-size:.9em}
/* メニュー */
.blk{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0;background:#fff}
.blk .no{font-weight:bold;width:2.2em}
.blk select{max-width:360px}
.blk .cnt{min-width:3.5em;text-align:center}
.blk .rs{flex-basis:100%;font-size:.8em;color:var(--sub)}
/* 練習画面 */
#pv{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);height:100vh;height:100dvh;z-index:10}
.pvh{display:flex;align-items:center;gap:12px;padding:8px 14px;background:#fff;border-bottom:2px solid var(--line)}
.pvh .t{flex:1;font-size:.85em;color:var(--sub)}
.pvh .pg{font-size:.9em}
.prompt{padding:10px 20px 4px;font-size:1.15em;font-weight:bold;text-align:center}
.pvmain{flex:1;min-height:0;display:flex;gap:18px;padding:10px 18px}
.pvmain.col{flex-direction:column}
.stim{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-width:0;min-height:0}
.stim.side{flex:0 0 38%}
.pvmain.col .stim.side{flex:0 0 40%}
.stim.full{flex:1}
.stim.bar{flex:0 0 auto}
.spic{background:#fff;border:2px solid var(--line);border-radius:16px;padding:8px}
.spic svg,.pic svg{width:100%;height:100%;display:block}
.prompt.wcmd{font-size:1.9em;font-weight:normal;background:#fff;border:2px solid var(--line);border-radius:14px;margin:8px 18px 0;padding:10px 20px}
.spics{display:flex;gap:12px;justify-content:center;align-items:center;max-width:100%}
.stim.side.big{flex-basis:58%}
.pvmain[data-col] .stim.side{flex:1 1 55%;justify-content:flex-start}
.stext{white-space:pre-line;font-size:2.1em;line-height:1.35;text-align:center;background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px 26px;max-width:100%;word-break:break-all}
.stext.long{font-size:1.3em;text-align:left;overflow:auto;max-height:100%}
.hintbox{font-size:1.05em;background:var(--warn);border:2px solid #e2cf95;border-radius:12px;padding:6px 16px;text-align:center;max-width:100%}
.ans{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:10px}
.fit{flex:1;min-height:0;display:grid;gap:14px;justify-content:center;align-content:center}
.opt{padding:6px;border:3px solid #a7a296;border-radius:16px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:64px;min-width:64px;position:relative;overflow:hidden}
.opt .pic{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.opt .pic svg{max-height:100%}
.opt .ot{font-size:1.5em;line-height:1.3}
.opt.ot2 .ot{font-size:1.8em}
.opt.sel{border-color:var(--main);box-shadow:0 0 0 4px var(--main2)}
.opt.right{border-color:var(--ok);box-shadow:0 0 0 5px #cfe3d6}
.opt.wrong{border-color:var(--ng)}
.opt.off{opacity:.15;pointer-events:none}
.opt .num{position:absolute;left:8px;top:4px;font-size:1.1em;font-weight:bold;color:var(--main);background:var(--main2);border-radius:50%;width:1.6em;height:1.6em;line-height:1.6em;text-align:center}
.nopic{display:flex;align-items:center;justify-content:center;width:100%;height:100%;color:#999;border:2px dashed #ccc;font-size:.7em}
.yn{display:flex;gap:24px;justify-content:center;align-items:center;flex:1}
.yn button{min-width:200px;min-height:120px;font-size:1.6em}
.fb{min-height:1.8em;text-align:center;font-size:1.1em;padding:0 10px}
.fb.ok{color:var(--ok)} .fb.ng{color:var(--ng)}
.again{font-size:1.05em}
.tray{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center;min-height:110px;padding:10px;border:2px dashed #b9b4a6;border-radius:14px;background:#fff}
.tray.pool{border-style:solid;background:transparent;border-color:transparent}
.card2{min-height:88px;min-width:88px;padding:6px 20px;font-size:1.5em;border:3px solid #a7a296;border-radius:14px;background:#fff}
.card2 .pic{width:110px;height:110px;display:block}
.card2.used{visibility:hidden}
.keys{display:grid;grid-template-columns:repeat(3,96px);gap:10px;justify-content:center}
.keys button{min-height:76px;font-size:1.5em;padding:0}
.inbox{font-size:2.2em;min-width:5em;text-align:center;border-bottom:4px solid #555;margin:6px auto;min-height:1.4em}
.wbox{position:relative;flex:1;min-height:0;background:#fff;border:2px solid var(--line);border-radius:16px;overflow:hidden}
.wbox canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.wguide{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;gap:10px;pointer-events:none}
.wguide span{border:3px dashed #c5c0b2;border-radius:6px}
.model{position:absolute;right:12px;top:8px;font-size:2em;color:#777;background:#fffdf3;border:2px solid #e2cf95;border-radius:10px;padding:0 14px;pointer-events:none}
.wtools{display:flex;gap:10px;justify-content:center}
.band{background:#2b2f36;color:#f2f2f2;padding:8px 12px;border-top:3px solid #11151a}
.band button{background:#3a404a;color:#fff;border-color:#59616e;min-height:64px}
.band button.on{background:#e7eef6;color:#14324f}
.band button.p{background:#4f86b8;border-color:#4f86b8}
.band .r1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.band .r2{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:.8em}
.rv{cursor:pointer}.rv .rvx{display:none}.rv.open .rvx{display:inline}.rv.open .rvb{display:none}
.rv .rvb{border:1px dashed currentColor;border-radius:6px;padding:4px 10px;opacity:.85}
.band input{background:#fff;color:#111;min-height:52px;flex:1;min-width:200px}
.band .gl{font-size:.75em;color:#c6ccd6}
.band .sp{flex:1}
.band .hl{font-size:.85em;color:#ffe9a8}
.band.closed .r2,.band.closed .hide-c{display:none}
.solo-bar{display:flex;gap:12px;justify-content:flex-end;padding:8px 14px}
.bstart{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.bstart .big{font-size:1.5em;font-weight:bold}
/* グラフ */
.chart svg{width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:10px}
/* 印刷用の教材・プリント  作成：KENTA SHINKAWA */
a.btn{display:inline-flex;align-items:center;justify-content:center;min-height:64px;padding:0 20px;border:2px solid var(--main);border-radius:12px;background:var(--main);color:#fff;text-decoration:none}
.kz{border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0;background:#fff}
.kz.used{background:#f1f0ea}
.kz .kz-t{margin-bottom:6px}
.tag.u{background:#ecebe6;border-color:#b5b2a8;color:#444}
.note{background:var(--warn);border:2px solid #e2cf95;border-radius:10px;padding:8px 14px;font-size:.85em}
.h3{font-size:.95em;margin:16px 0 4px}
details.kzg{border-top:1px solid var(--line)}
details.kzg>summary{min-height:60px;display:flex;align-items:center;font-weight:bold;cursor:pointer;padding:0 6px}
.pp-wrap{overflow-x:auto;padding:2px 0;background:#e9e9e9;border-radius:10px}
.pp-sheet{width:210mm;height:296mm;padding:12mm;margin:8mm auto;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.25);display:flex;flex-direction:column;overflow:hidden;font-family:"BIZ UDPGothic","BIZ UDゴシック","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;color:#1a1a1a;font-size:13pt;line-height:1.45;text-align:left}
.pp-head{flex:0 0 auto;display:flex;justify-content:space-between;align-items:flex-end;gap:5mm;border-bottom:2px solid #333;padding-bottom:2mm;margin-bottom:3mm}
.pp-head h1{font-size:17pt;margin:0;line-height:1.25}
.pp-tag{font-size:10pt;color:#555}
.pp-who{font-size:11pt;white-space:nowrap;line-height:2}
.pp-who span{display:inline-block;border-bottom:1px solid #333;min-width:36mm;margin:0 1mm}
.pp-who span.d{min-width:9mm}
.pp-ask{flex:0 0 auto;font-size:14pt;font-weight:700;margin:0 0 2mm;line-height:1.5}
.pp-body{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden;position:relative}
.pp-body.spread{justify-content:space-evenly}
.pp-body.c2{display:grid;grid-template-columns:1fr 1fr;column-gap:6mm;align-content:start}
.pp-body.c2.spread{align-content:space-evenly}
.pp-body.hint::after{content:"";position:absolute;top:0;bottom:0;right:44mm;border-left:2px dashed #555}
.pp-hh{display:flex;justify-content:flex-end;flex:0 0 auto}
.pp-hh span{width:44mm;font-size:9.5pt;font-weight:700;line-height:1.35;border-left:2px dashed #555;padding:0 0 1mm 2mm}
.pp-body.hint .pp-c{padding-right:3mm}
.pp-q{display:flex;gap:2mm;align-items:flex-start;padding:1.5mm 0;border-bottom:1px solid #ddd;flex:0 0 auto}
.pp-q:last-child{border-bottom:0}
.pp-n{flex:0 0 9mm;font-size:15pt;font-weight:700;line-height:1.3}
.pp-c{flex:1 1 auto;min-width:0}
.pp-qa{font-size:12.5pt;font-weight:700;margin-bottom:1mm}
.pp-hc{flex:0 0 42mm;font-size:9.5pt;line-height:1.35;color:#222;padding-left:1mm}
.pp-hc div{margin-bottom:1mm}
.pp-row{display:flex;gap:4mm;align-items:center}
.pp-col{flex:1 1 auto;min-width:0}
.pp-pic{display:inline-block;flex:0 0 auto;border:1px solid #bbb;border-radius:2mm;background:#fff;overflow:hidden}
.pp-pic svg{width:100%;height:100%;display:block}
.pp-opts{display:flex;flex-wrap:wrap;gap:2mm 4mm;align-items:flex-end}
.pp-o{display:flex;flex-direction:column;align-items:center;gap:.5mm}
.pp-k{font-size:12.5pt;font-weight:700;line-height:1.2}
.pp-t{border:1.5px solid #333;border-radius:2mm;padding:.5mm 3mm;line-height:1.35}
.pp-cap{font-size:10.5pt}
.pp-blank{font-size:13pt;letter-spacing:.1em}
.pp-st{line-height:1.35;margin:0 0 1.5mm;font-weight:700}
.pp-st.long{font-size:13pt;font-weight:400;white-space:pre-line;border:1.5px solid #333;border-radius:2mm;padding:2mm 4mm}
.pp-spk{font-size:11pt;color:#555;margin:0 0 1mm}
.pp-rec{font-size:11pt;margin-top:1.5mm;white-space:nowrap}
.pp-bxs{display:flex;gap:1.5mm}
.pp-bx{display:inline-block;border:1.5px solid #333;background:#fff}
.pp-fr{flex:1 1 auto;border:1.5px solid #333;border-radius:2mm;min-width:40mm}
.pp-yn{display:flex;gap:8mm}
.pp-yn span{border:1.5px solid #333;border-radius:3mm;padding:1mm 6mm;font-size:16pt}
.pp-ab{flex:0 0 auto;display:inline-block;border:1.5px solid #333;border-radius:2mm;width:36mm}
.pp-foot{flex:0 0 auto;display:flex;justify-content:space-between;font-size:8.5pt;color:#777;padding-top:2mm}
.pp-g{font-size:10.5pt;line-height:1.5}
.pp-g h2{font-size:12.5pt;margin:3mm 0 1mm;border-bottom:1px solid #999;padding-bottom:.5mm}
.pp-g p{margin:0 0 1.5mm}
.pp-sheet table{border-collapse:collapse;width:100%;margin:0 0 2mm}
.pp-sheet th,.pp-sheet td{border:1px solid #bbb;padding:.8mm 2mm;text-align:left;vertical-align:top;color:#1a1a1a;font-size:10pt;line-height:1.4}
.pp-sheet th{background:#f2f2f2;font-weight:700}
.pp-body.pa{display:block}
.pa-h{font-size:11.5pt;font-weight:700;border-bottom:1.5px solid #333;margin:2.5mm 0 1mm;padding-bottom:.5mm}
.pa-r{display:flex;gap:2mm;font-size:10.5pt;line-height:1.4;padding:.6mm 0;border-bottom:1px dotted #bbb}
.pa-n{flex:0 0 7mm;font-weight:700}
.pa-read{font-weight:700}
.pa-note{color:#555;font-size:9.5pt}
body.pp-only .top,body.pp-only .noprint,body.pp-only .foot{display:none}
body.pp-only .wrap{padding:0;max-width:none}
body.pp-only .pp-wrap{padding:0;background:#fff;border-radius:0}
body.pp-only .pp-sheet{margin:0;box-shadow:none}
@media print{
  @page{size:A4 portrait;margin:12mm}
  html,body{background:#fff!important}
  .top,.noprint,.foot,#toast,#errbar{display:none!important}
  .wrap{max-width:none;padding:0;margin:0}
  .pp-wrap{overflow:visible;padding:0;background:#fff;border-radius:0}
  .pp-sheet{width:186mm;height:272mm;padding:0;margin:0;box-shadow:none;page-break-after:always;break-after:page}
  .pp-sheet:last-child{page-break-after:auto;break-after:auto}
}
@media (max-width:700px){ .slta-grid{grid-template-columns:1fr} }
</style>

<body>
<div id="errbar"></div>
<div id="app"><div class="wrap"><p>読み込み中です…</p></div></div>
<div id="toast"></div>
<script>
"use strict";
/* ============================================================
   言語訓練アプリ（失語症の訓練・iPad向け）
   作成：KENTA SHINKAWA
   - 外部通信なし。記録はこの端末の中（localStorage）だけに保存。
   - 絵・語・問題は data\*.js から読み込む（無いファイルは飛ばす）。
   ============================================================ */
var ERRS=[];
window.onerror=function(msg,src,line,col){ ERRS.push(msg+" ("+(src||"").split("/").pop()+":"+line+")"); var b=document.getElementById("errbar"); if(b){ b.style.display="block"; b.textContent="エラー："+ERRS.join("\n"); } };
const DATA_FILES=["data/pics_food.js","data/pics_daily.js","data/pics_house.js","data/pics_nature.js","data/pics_tools.js","data/pics_action.js","data/pics_numbers.js","data/words.js","data/bank_words.js","data/bank_sentences.js","data/bank_numbers_memory.js","data/kyozai.js"];
const LOADED=[], MISSING=[];
function loadData(i){
  if(i>=DATA_FILES.length){ boot(); return; }
  const s=document.createElement("script"); s.src=DATA_FILES[i];
  s.onload=()=>{ LOADED.push(DATA_FILES[i]); loadData(i+1); };
  s.onerror=()=>{ MISSING.push(DATA_FILES[i]); s.remove(); loadData(i+1); };
  document.head.appendChild(s);
}

/* ---------- SLTA の26項目（プロフィールツールと同じ） ---------- */
const SLTA=[[1,"聴く","単語の理解",10,"items"],[2,"聴く","短文の理解",10,"items"],[3,"聴く","口頭命令に従う",10,"items"],[4,"聴く","仮名の理解",10,"items"],
[5,"話す","呼称",20,"items"],[6,"話す","単語の復唱",10,"items"],[7,"話す","動作説明",10,"items"],[8,"話す","まんがの説明",6,"stage"],
[9,"話す","文の復唱",5,"items"],[10,"話す","語の列挙",15,"count"],[11,"話す","漢字・単語の音読",5,"items"],[12,"話す","仮名1文字の音読",10,"items"],
[13,"話す","仮名・単語の音読",5,"items"],[14,"話す","短文の音読",5,"items"],
[15,"読む","漢字・単語の理解",10,"items"],[16,"読む","仮名・単語の理解",10,"items"],[17,"読む","短文の理解",10,"items"],[18,"読む","書字命令に従う",10,"items"],
[19,"書く","漢字・単語の書字",5,"items"],[20,"書く","仮名・単語の書字",5,"items"],[21,"書く","まんがの説明",6,"stage"],[22,"書く","仮名1文字の書取",10,"items"],
[23,"書く","漢字・単語の書取",5,"items"],[24,"書く","仮名・単語の書取",5,"items"],[25,"書く","短文の書取",5,"items"],[26,"計算","計算",20,"count"]];
const DOMS=["聴く","話す","読む","書く","計算"];
const TYPE_JP={choice:"選ぶ",yesno:"はい・いいえ",say:"口で答える",write:"書く",tapseq:"順に触る",order:"並べる",input:"数を入れる",span:"覚えて触る"};
const AUTO=new Set(["choice","yesno","tapseq","order","input","span"]);
const MIN_PER={choice:.5,yesno:.4,tapseq:.8,span:1,order:1,input:.6,say:.8,write:1.5};
const RECENT_MS=28*24*3600*1000; // 直近4週間
const STAGE_NAMES={6:"完全正答",5:"遅延完全正答",4:"不完全正答",3:"ヒント後正答",2:"関連反応",1:"誤答"};

/* ---------- 小さな道具 ---------- */
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>{ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const fmtD=d=>d?String(d).replace(/-/g,"/"):"日付なし";
const rnd=n=>Math.floor(Math.random()*n);
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let NOW=()=>Date.now(); // テストで時刻を進めるために差し替えられる
function toast(t){ const e=$("#toast"); e.textContent=t; e.style.display="block"; clearTimeout(toast.t); toast.t=setTimeout(()=>e.style.display="none",2200); }
function z2h(s){ return String(s).replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/．/g,"."); }

/* ---------- 仮名の道具 ---------- */
const SMALL="ゃゅょぁぃぅぇぉゎャュョァィゥェォヮ";
const h2k=s=>String(s).replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+0x60));
const k2h=s=>String(s).replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
function moras(s){ const a=[]; for(const c of String(s)){ if(SMALL.includes(c)&&a.length) a[a.length-1]+=c; else a.push(c); } return a; }
const KROWS=["あいうえお","かきくけこ","さしすせそ","たちつてと","なにぬねの","はひふへほ","まみむめも","やゆよ","らりるれろ","わ","がぎぐげご","ざじずぜぞ","だぢづでど","ばびぶべぼ","ぱぴぷぺぽ"];
const KANA46="あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわ".split("");
const VOW="あいうえお";
function kanaRow(c){ return KROWS.find(r=>r.includes(c))||""; }
function kanaVowelIdx(c){ for(const r of KROWS){ const i=r.indexOf(c); if(i>=0) return r.length===5?i:(r==="やゆよ"?[0,2,4][i]:0); } return -1; }

const W=id=>WORDS[id];
const yomiOf=w=>String((w&&w.yomi)||"").replace(/[0-9０-９]/g,"");
const isKata=w=>/^[゠-ヿー]+$/.test((w&&w.hyoki)||"");
const kanaForm=w=>w&&w.kana?String(w.kana):isKata(w)?h2k(yomiOf(w)):yomiOf(w);
/* 一緒に選択肢に出さない組（正解が2つになる・言い換え・絵が似ている）。単語課題の gen.py の CONFLICT と同じ表 */
const CONFLICT_PAIRS=[["n01","n11"],["n01","n12"],["n01","n13"],["n01","n14"],
 ["a03","a07"],["f22","a11"],["h12","h07"],["h13","h14"],["c05","c15"],["d01","f25"],
 ["b05","b08"],["n02","n15"],["d04","d05"],["v02","v05"],["v02","v09"],["v02","v06"],["v02","v03"],
 ["d17","d19"],["n09","n08"],["b04","b07"],["t10","t11"],["i16","i04"],["i16","i05"],
 ["s07","s08"],["s09","s08"],["d02","d01"],["f26","d01"],["act23","h13"],["f21","a07"],
 ["d18","a04"],["f24","f25"],["e10","f22"],["e10","a11"],["b09","b01"],["b09","b02"],["b09","b03"],["b09","b04"],
 ["b07","n15"],["n01","b03"],["act10","act15"], // 同じ読み（歯と葉、花と鼻、切ると着る）
 ["s06","h19"]]; // ホチキスと爪切りは絵が似ている
const CONFLICT={}; CONFLICT_PAIRS.forEach(([a,b])=>{ (CONFLICT[a]=CONFLICT[a]||new Set()).add(b); (CONFLICT[b]=CONFLICT[b]||new Set()).add(a); });
function conflict(a,b){ if(a===b) return true; if(CONFLICT[a]&&CONFLICT[a].has(b)) return true; const x=WORDS[a], y=WORDS[b]; if(!x||!y) return false;
  return yomiOf(x)===yomiOf(y)||x.hyoki===y.hyoki; }
const compat=(id,list)=>list.every(x=>!conflict(id,x));
/* list から、chosen とも互いとも衝突しない語を k 個まで選ぶ */
function pickCompat(chosen,list,k){ const out=[]; for(const id of list){ if(out.length>=k) break; if(compat(id,chosen)&&compat(id,out)) out.push(id); } return out; }
const isAct=id=>/^act/.test(id)||(W(id)&&W(id).cat==="動作");
const hasPic=id=>!!PICS[id];
function picHTML(id){ return PICS[id]||`<div class="nopic">絵がありません（${esc(id)}）</div>`; }
function speakName(o){ if(o.text) return o.text; const w=W(o.pic); return w?yomiOf(w):""; }

/* 対象者IDを自動で作る：P＋年月日6桁＋「-」＋読み間違えにくい英数字3文字（端末をまたいでも重なりにくい） */
function genPatientId(){
  const C="ABCDEFGHJKMNPQRSTUVWXYZ23456789", d=new Date(), p2=n=>String(n).padStart(2,"0");
  const head="P"+p2(d.getFullYear()%100)+p2(d.getMonth()+1)+p2(d.getDate())+"-";
  for(let k=0;k<200;k++){ let s=""; const r=new Uint32Array(3); (window.crypto&&crypto.getRandomValues)?crypto.getRandomValues(r):r.forEach((_,i)=>r[i]=Math.floor(Math.random()*1e9));
    for(let i=0;i<3;i++) s+=C[r[i]%C.length]; const id=head+s; if(!DB.patients[id]) return id; }
  return head+Date.now().toString(36).toUpperCase();
}
function newPatient(id,nick){ return {id:String(id),nick:nick||"",created:today(),evals:[],lv:{},sessions:[],usedQ:{},usedW:{},kyozai:{},prints:[]}; }
function fixDB(o){
  const b=blankDB(); if(!o||typeof o!=="object") return b;
  Object.assign(b.settings,o.settings||{});
  b.current=o.current||"";
  for(const [k,p] of Object.entries(o.patients||{})){
    if(!p||typeof p!=="object") continue;
    const q=newPatient(p.id||k,p.nick); q.created=p.created||q.created;
    q.evals=Array.isArray(p.evals)?p.evals.filter(e=>e&&Array.isArray(e.pct)).map(e=>({date:e.date||"",pct:SLTA.map((_,i)=>numOrNull(e.pct[i])),src:e.src||""})):[];
    q.lv=(p.lv&&typeof p.lv==="object")?p.lv:{};
    q.sessions=Array.isArray(p.sessions)?p.sessions:[];
    q.usedQ=p.usedQ||{}; q.usedW=p.usedW||{};
    q.kyozai=(p.kyozai&&typeof p.kyozai==="object"&&!Array.isArray(p.kyozai))?p.kyozai:{}; q.prints=Array.isArray(p.prints)?p.prints:[];
    b.patients[q.id]=q;
  }
  if(!b.patients[b.current]) b.current=Object.keys(b.patients)[0]||"";
  return b;
}
function numOrNull(v){ if(v===null||v===undefined||v==="") return null; const n=Number(v); return isFinite(n)?n:null; }

function speak(text,rateMul){
  return new Promise(res=>{
    text=String(text||""); if(!text){ res(); return; }
    const rate=(DB.settings.rate||0.9)*(rateMul||1);
    let fin=false; const done=()=>{ if(fin) return; fin=true; clearTimeout(t); res(); };
    const t=setTimeout(done,900+text.length*260/rate);
    if(!("speechSynthesis" in window)||typeof SpeechSynthesisUtterance==="undefined") return;
    try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang="ja-JP"; u.rate=rate; if(jaVoice) u.voice=jaVoice; u.onend=done; u.onerror=done; speechSynthesis.speak(u); }catch(e){}
  });
}

/* ============================================================
   課題（skill）の一覧：アプリが語のデータから作る課題 ＋ 問題データの課題
   ============================================================ */
const GEN={}; // kind -> 定義
function defGen(k,o){ o.k=k; GEN[k]=o; }
const optN=L=>[2,3,4,6,6][L-1];
const nounsPic=()=>Object.keys(WORDS).filter(id=>hasPic(id)&&!isAct(id));
const actsPic=()=>Object.keys(WORDS).filter(id=>hasPic(id)&&isAct(id));
const nounsAll=()=>Object.keys(WORDS).filter(id=>!isAct(id));
const withKanji=list=>list.filter(id=>{ const w=W(id); return w.kanji&&w.kanji!==w.yomi&&!isKata(w); });
function levelOK(id,L){ const w=W(id); const f=w.freq||1, m=w.mora||moras(yomiOf(w)).length; const fmax=[1,1,2,3,3][L-1], mmax=[3,4,5,99,99][L-1]; return f<=fmax&&m<=mmax; }
function poolAt(list,L,min){ const a=list.filter(id=>levelOK(id,L)); return a.length>=(min||1)?a:list; }

/* 最近出した語かどうか（新しいほど大きい値） */
function wRec(ctx,id){ if(ctx.sess.has(id)) return NOW()+1; return (ctx.p.usedW[id]||0); }
function qRec(ctx,qid){ return ctx.p.usedQ[qid]||0; }
/* 古い順（4週間より前・未使用はばらばらに）に並べる */
function byFresh(ctx,ids,recFn){
  const now=NOW(); const a=[],b=[];
  for(const id of ids){ const r=recFn(id); if(r<=now-RECENT_MS) a.push({id,r}); else b.push({id,r}); }
  return shuffle(a).concat(b.sort((x,y)=>x.r-y.r)).map(x=>x.id);
}
/* 紛らわしい選択肢を level に合わせて選ぶ */
function distract(ctx,t,L,pool,n){
  n=Math.min(n||optN(L),pool.length);
  const w=W(t); const ty=w.yomi, th=w.hyoki;
  const others=pool.filter(id=>id!==t&&!conflict(id,t));
  const near=new Set(w.near||[]), snd=new Set(w.sound||[]);
  const tier=id=>{ const x=W(id); const sameC=x.cat===w.cat, sameS=sameC&&x.sub===w.sub;
    if(L<=1) return sameC?3:0;
    if(L===2) return sameC?1:0;
    if(L===3) return sameS?0:sameC?0:1;
    if(L===4) return near.has(id)||snd.has(id)?0:sameC?1:2;
    return near.has(id)||snd.has(id)?0:sameS?1:sameC?2:3; };
  const groups={}; for(const id of others){ const k=tier(id); (groups[k]=groups[k]||[]).push(id); }
  let res=[]; Object.keys(groups).sort((a,b)=>a-b).forEach(k=>{ res=res.concat(byFresh(ctx,groups[k],id=>wRec(ctx,id))); });
  if(L===2){ // 同じ仲間は1つまで
    const sc=res.filter(id=>W(id).cat===w.cat), dc=res.filter(id=>W(id).cat!==w.cat);
    res=dc.slice(0,n-2).concat(sc.slice(0,1)).concat(dc.slice(n-2)).concat(sc.slice(1));
  }
  return shuffle([t].concat(pickCompat([t],res,n-1)));
}
function compHints(id,speakText){ const w=W(id); return [
  {t:"もう一度ゆっくり読み上げます",act:"slow"},{t:"区切って読み上げます",act:"split"},
  {t:"身ぶりを添えてください",teacher:true},{t:"文字を添えます",act:"text",text:w?w.hyoki:speakText},{t:"選択肢を減らします",act:"reduce"}]; }

function calcProblem(L){
  const r=(a,b)=>a+rnd(b-a+1); let a,b,op;

  else if(L===2){ op=Math.random()<.5?"+":"-"; if(op==="+"){ a=r(3,12); b=r(2,8); } else { a=r(6,18); b=r(1,a-1); } }
  else if(L===3){ op=Math.random()<.5?"+":"-"; a=r(12,68); b=r(11,39); if(op==="-"&&b>a){ const x=a; a=b; b=x; } if(a===b) a+=7; }
  else if(L===4){ const k=rnd(3); if(k===0){ op="×"; a=r(2,9); b=r(2,9); } else if(k===1){ op="÷"; b=r(2,9); a=b*r(2,9); } else { op="+"; a=r(105,480); b=r(26,95); } }
  else { const k=rnd(3); if(k===0){ op="×"; a=r(12,48); b=r(3,9); } else if(k===1){ op="-"; a=r(1000,1000); b=r(120,880); } else { op="÷"; b=r(3,9); a=b*r(12,40); } }
  const ans=op==="+"?a+b:op==="-"?a-b:op==="×"?a*b:a/b; return {a,b,op,ans};
}

/* 課題の一覧を作る（アプリが作る課題＋問題データの課題） */
let SKILLS={};
function buildSkills(){
  SKILLS={};
  for(const g of Object.values(GEN)){
    const pool=g.kana||g.calc?null:g.pool(); const ok=g.kana||g.calc||pool.length>=(g.min||2);
    if(!ok) continue;
    SKILLS[g.name]={name:g.name,dom:g.dom,slta:g.slta.slice(),type:g.type,gen:g.k,bank:[]};
  }
  for(const it of BANK){
    if(!it||!it.skill||!it.type) continue;
    let s=SKILLS[it.skill]; if(!s){ s=SKILLS[it.skill]={name:it.skill,dom:it.domain||"",slta:[],type:it.type,gen:null,bank:[],types:{}}; }
    s.bank.push(it); (it.slta||[]).forEach(n=>{ if(!s.slta.includes(n)) s.slta.push(n); });
    if(!s.gen){ s.types=s.types||{}; s.types[it.type]=(s.types[it.type]||0)+1; s.type=Object.entries(s.types).sort((a,b)=>b[1]-a[1])[0][0]; }
  }
}
const skillsForNo=no=>Object.values(SKILLS).filter(s=>s.slta.includes(no)).sort((a,b)=>(a.slta.indexOf(no)-b.slta.indexOf(no))||((b.gen?1:0)-(a.gen?1:0)));

/* ---------- 正答率と level ---------- */
const pctLevel=p=>p<20?1:p<40?2:p<60?3:p<80?4:5;
const latestEval=p=>p&&p.evals.length?p.evals.slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))).pop():null;
function recommend(p){
  const ev=latestEval(p); if(!ev) return null;
  return SLTA.map((s,i)=>{ const pct=ev.pct[i]; const row={no:s[0],dom:s[1],name:s[2],pct};
    if(pct===null) return Object.assign(row,{none:true,skills:[]});
    row.level=pctLevel(pct); row.maint=pct>=95;
    row.skills=skillsForNo(s[0]).map(sk=>({skill:sk.name,type:sk.type,base:row.level,level:effLevel(p,sk.name,row.level),over:p.lv[sk.name]!=null}));

}

const pctTxt=v=>v==null?"－":(Math.round(v*10)/10)+"%";

/* ---------- 今日の訓練メニュー ---------- */
function blockSize(type){ return clamp(Math.round(6/(MIN_PER[type]||.8)),5,10); }
function lastSession(p){ const s=p.sessions.filter(x=>x.blocks&&x.blocks.length); return s.length?s[s.length-1]:null; }
function buildMenu(p,solo,nBlocks){
  nBlocks=clamp(nBlocks||DB.settings.blocks||4,3,5);
  const rec=recommend(p); const cands=[];
  if(rec){ for(const r of rec){ if(r.none) continue; for(const s of r.skills){ if(solo&&!AUTO.has(s.type)) continue;
      cands.push({skill:s.skill,type:s.type,level:s.level,pct:r.pct,no:r.no,dom:r.dom,maint:r.maint,reason:`${r.name} ${pctTxt(r.pct)} → ${s.skill}・level${s.level}${s.over?"（指導者が変更）":""}`}); } } }
  const best={}; for(const c of cands){ if(!best[c.skill]||c.pct<best[c.skill].pct) best[c.skill]=c; }
  const pool=Object.values(best); if(!pool.length) return [];
  const ls=lastSession(p); const lastSk=new Set(ls?ls.blocks.map(b=>b.skill):[]);
  const chosen=[];
  const score=c=>{ const prev=chosen[chosen.length-1]; let s=c.pct+Math.random()*18; if(c.maint) s+=70; if(lastSk.has(c.skill)) s+=25;
    if(prev&&prev.type===c.type) s+=45; if(chosen.some(x=>x.no===c.no)) s+=22; if(chosen.some(x=>x.type===c.type)) s+=10; if(chosen.some(x=>x.dom===c.dom)) s+=12; return s; };
  const weakN=Math.min(nBlocks-1,pool.length);
  for(let i=0;i<weakN;i++){ const left=pool.filter(c=>!chosen.includes(c)); if(!left.length) break; left.sort((a,b)=>score(a)-score(b)); chosen.push(left[0]); }
  // 得意な課題を1つ（成功体験と代償の練習）
  const left=pool.filter(c=>!chosen.includes(c));
  if(left.length){ const strong=left.filter(c=>c.pct>=60); const prev=chosen[chosen.length-1];
    let pick=null; if(strong.length){ const st=shuffle(strong).sort((a,b)=>(b.pct-a.pct)+((a.type===(prev&&prev.type))?30:0)-((b.type===(prev&&prev.type))?30:0)); pick=st.find(c=>!lastSk.has(c.skill))||st[0]; pick=Object.assign({},pick,{strong:true}); }
    else { left.sort((a,b)=>score(a)-score(b)); pick=left[0]; }
    chosen.push(pick); }
  // 同じ形が続かないように並べ直す
  for(let i=1;i<chosen.length;i++){ if(chosen[i].type===chosen[i-1].type){ const j=chosen.findIndex((c,k)=>k>i&&c.type!==chosen[i-1].type&&(!chosen[i+1]||true)); if(j>0){ const x=chosen[i]; chosen[i]=chosen[j]; chosen[j]=x; } } }
  return chosen.map(c=>({skill:c.skill,level:c.level,n:blockSize(c.type),reason:(c.strong?"得意な課題（成功体験と代償の練習）："+"":"")+c.reason,strong:!!c.strong}));
}
function menuMinutes(menu){ return Math.round(menu.reduce((a,b)=>a+b.n*(MIN_PER[(SKILLS[b.skill]||{}).type]||.8),0)+menu.length*1); }

/* ---------- 問題を選ぶ（最近出したものは後回し） ---------- */
function itemWordsKey(it){ const a=[]; if(it.stim&&it.stim.pic) a.push(it.stim.pic);
  if(it.type==="choice"&&it.options&&it.options[it.answer]&&it.options[it.answer].pic) a.push(it.options[it.answer].pic);
  if((it.type==="tapseq")&&Array.isArray(it.answer)) it.answer.forEach(i=>{ const o=(it.options||[])[i]; if(o&&o.pic) a.push(o.pic); });
  if(it.type==="span"&&Array.isArray(it.seq)) it.seq.forEach(i=>{ const o=(it.options||[])[i]; if(o&&o.pic) a.push(o.pic); });
  (it.pieces||[]).forEach(x=>{ if(x&&x.pic) a.push(x.pic); }); return a; }
function itemAllWords(it){ const a=new Set(it.words||[]); if(it.stim&&it.stim.pic) a.add(it.stim.pic); (it.options||[]).forEach(o=>{ if(o&&o.pic) a.add(o.pic); }); (it.pieces||[]).forEach(x=>{ if(x&&x.pic) a.add(x.pic); }); return Array.from(a); }
function bankItem(it){ const o=JSON.parse(JSON.stringify(it)); o.hints=(it.hints||[]).map(h=>typeof h==="string"?{t:h}:h); o.words=itemAllWords(it); o.gen=false; return o; }
function makeItems(p,block,sessUsed){
  const sk=SKILLS[block.skill]; if(!sk) return [];
  const L=block.level, n=block.n; const ctx={p,sess:sessUsed||new Set()};
  const cands=[];
  // 問題データ（level が同じもの、足りなければ前後の level）
  const bk=sk.bank.filter(it=>it.level===L); const bk2=sk.bank.filter(it=>it.level!==L); // 足りないときは近い level から
  const bRec=it=>{ let r=qRec(ctx,it.id); itemWordsKey(it).forEach(w=>r=Math.max(r,wRec(ctx,w))); return r; };
  bk.forEach(it=>cands.push({kind:"b",it,r:bRec(it)}));
  if(sk.gen){ const g=GEN[sk.gen];
    if(g.calc){ for(let i=0;i<40;i++){ const q=calcProblem(L); const id=`gen-calc-${q.a}${q.op}${q.b}`; if(cands.some(c=>c.id===id)) continue; cands.push({kind:"g",q,id,r:qRec(ctx,id)}); } }
    else if(g.kana){ KANA46.forEach(k=>cands.push({kind:"g",q:k,r:qRec(ctx,`gen-${g.k}-${k}`)})); }
    else { poolAt(g.pool(),L,Math.min(n,4)).forEach(t=>cands.push({kind:"g",q:t,r:Math.max(qRec(ctx,`gen-${g.k}-${t}`),wRec(ctx,t))})); }
  }
  if(cands.length<n) bk2.forEach(it=>cands.push({kind:"b",it,r:bRec(it),d:Math.abs((it.level||3)-L)}));
  const now=NOW(); const fresh=shuffle(cands.filter(c=>c.r<=now-RECENT_MS)).sort((a,b)=>(a.d||0)-(b.d||0)), old=cands.filter(c=>c.r>now-RECENT_MS).sort((a,b)=>(a.d||0)-(b.d||0)||a.r-b.r);
  // 新しい問題と、作る問題を混ぜる（問題データを優先しすぎない）
  const order=fresh.concat(old); const out=[]; const ids=new Set();
  const keyW=c=>c.kind==="b"?itemWordsKey(c.it):(typeof c.q==="string"&&WORDS[c.q]?[c.q]:[]);
  // 1回目：この訓練ですでに出した語は飛ばす。2回目：足りなければ使う
  for(const pass of [0,1]) for(const c of order){ if(out.length>=n) break; if(c.used) continue;
    if(pass===0&&keyW(c).some(w=>ctx.sess.has(w))) continue;
    if(block.paper&&c.kind==="b"&&!paperOK(c.it)) continue; // 印刷用：紙で使えない形は除く
    if(block.solo&&c.kind==="b"&&(!AUTO.has(c.it.type)||(c.it.type==="order"&&(c.it.pieces||[]).length>=4))) continue; // ひとりで：自動で正誤が分かるものだけ（4枚以上の並べかえは別解があり得るので除く）
    c.used=true;
    let it=null; try{ it=c.kind==="b"?bankItem(c.it):GEN[sk.gen].make(ctx,c.q,L); }catch(e){ console.error(e); it=null; }
    if(!it||ids.has(it.id)) continue;
    if(block.paper&&!paperOK(it)) continue;
    if(it.type==="choice"&&(!it.options||it.options.length<2||it.answer<0)) continue;
    ids.add(it.id); out.push(it); (it.words||[]).forEach(w=>{ if(w&&!isAct(w)||w) ctx.sess.add(w); });
    if(it.stim&&it.stim.pic) ctx.sess.add(it.stim.pic);
  }
  return out;
}

function parseScore(raw,i){ // 正答率（%）。段階の列「6655432166」、「#8」（正答数）も可
  const s=z2h(String(raw||"")).trim().replace(/[%％\s]/g,""); if(s==="") return {v:null};
  const it=SLTA[i];
  if(s[0]==="#"||s[0]==="＃"){ const c=Number(s.slice(1)); if(!isFinite(c)||c<0||c>it[3]&&it[4]!=="count") return {bad:true}; return {v:Math.min(100,c/it[3]*100)}; }
  if(it[4]==="items"&&/^[1-6x\-]{4,}$/i.test(s)){ const ch=s.replace(/-/g,""); if(!ch.length) return {v:null}; const c=(ch.match(/[56]/g)||[]).length; return {v:c/it[3]*100}; }
  const n=Number(s); if(!isFinite(n)||n<0||n>100) return {bad:true}; return {v:n};
}

function importList(){
  if(!IMPORT) return ""; const L=IMPORT.list; if(L.error) return `<p class="err">${esc(L.error)}</p>`;
  if(!L.items.length) return `<p class="err">成績の入った評価回が見つかりませんでした。</p>`;

}
function profPct(o,e){ // プロフィールツール（fmt 3〜5）の1回分 → 26項目の正答率
  const row=(o.scores||[])[e]||[]; const max=Array.isArray(o.max)?o.max:[];
  return SLTA.map((s,i)=>{ let v=row[i]; const n=Number(max[i])>0?Number(max[i]):s[3];
    if(i===25&&Array.isArray(o.calc)&&Array.isArray(o.calc[e])&&o.calc[e].some(x=>x!==""&&x!=null)){ const sum=o.calc[e].reduce((a,x)=>a+(Number(z2h(x))||0),0); return Math.round(Math.min(100,sum/20*100)*10)/10; }
    if(v===null||v===undefined||v==="") return null;
    if(typeof v==="number") return Math.round(clamp(v,0,100)*10)/10; // すでに正答率
    v=z2h(String(v)).trim();
    if(s[4]==="stage"){ if(/^x$/i.test(v)) return 0; const g=Number(v); return g>=1&&g<=6?Math.round((g-1)/5*1000)/10:null; }
    if(s[4]==="count"){ const c=Number(v); if(!isFinite(c)) return null; const mx=i===9?15:n; return Math.round(Math.min(100,c/mx*100)*10)/10; }
    if(v[0]==="#"){ const c=Number(v.slice(1)); return isFinite(c)?Math.round(Math.min(100,c/n*100)*10)/10:null; }
    if(/^[1-6x\-]+$/i.test(v)){ const ch=v.replace(/-/g,""); if(!ch.length) return null; return Math.round((ch.match(/[56]/g)||[]).length/n*1000)/10; }
    const c=Number(v); return isFinite(c)?Math.round(clamp(c,0,100)*10)/10:null; });
}
function parseProfile(text){
  let o; try{ o=JSON.parse(text); }catch(e){ return {error:"読み込めませんでした。コピーした文字をそのまま貼り付けてください。",items:[]}; }
  const pats=[]; if(o&&o.patients&&typeof o.patients==="object") for(const [k,v] of Object.entries(o.patients)) pats.push([v&&v.name||k,v]); else if(o&&o.scores) pats.push([o.name||"（名前なし）",o]);
  else if(Array.isArray(o)) o.forEach((v,k)=>v&&v.scores&&pats.push([v.name||("データ"+(k+1)),v]));
  const items=[]; for(const [name,v] of pats){ if(!v||!Array.isArray(v.scores)) continue; v.scores.forEach((row,e)=>{ const pct=profPct(v,e); const filled=pct.filter(x=>x!=null).length; if(filled) items.push({name:String(name),e,date:(v.dates||[])[e]||"",pct,filled}); }); }
  return {items};
}

function layout(){

function fitGrid(g){
  const n=g.children.length; if(!n) return; const txt=g.classList.contains("txt"); const W0=g.clientWidth, H0=g.clientHeight, gap=14;
  const maxLen=txt?Math.max(1,...Array.from(g.children).map(c=>(c.textContent||"").trim().length)):1;
  let best=null; for(let c=g.dataset.row?n:1;c<=n;c++){ const r=Math.ceil(n/c); const cw=(W0-gap*(c-1))/c, ch=(H0-gap*(r-1))/r;
    const sc=txt?Math.min((cw-28)/(maxLen*1.05),(Math.min(ch,170)-16)/1.5):Math.min(cw,ch); if(!best||sc>best.sc) best={sc,c,cw,ch}; }
  let w,h; if(txt){ const fs=clamp(Math.floor(best.sc),20,60); w=Math.min(best.cw,Math.max(fs*maxLen*1.05+40,140)); h=Math.min(best.ch,Math.max(fs*1.6+24,80));
    Array.from(g.children).forEach(c=>{ const o=c.querySelector(".ot"); if(o) o.style.fontSize=fs+"px"; }); }

function setupCanvas(){
  const cv=$("#cv"); if(!cv) return; const S=PR.st; S.strokes=S.strokes||[];
  const r=cv.getBoundingClientRect(), d=window.devicePixelRatio||1; cv.width=Math.max(1,r.width*d); cv.height=Math.max(1,r.height*d);
  const g=cv.getContext("2d"); g.setTransform(d,0,0,d,0,0); g.lineCap="round"; g.lineJoin="round"; g.strokeStyle="#111"; g.fillStyle="#111";
  const lw=Math.max(5,Math.min(r.width,r.height)/60);

  if(h.act==="split"){ const t=h.say||it.speak||""; const parts=/[、。\s]/.test(t)?t.split(/[、。\s]+/).filter(Boolean):moras(t); speakSeq(parts,450); }
  if(h.act==="speak") speak(h.say||it.speak||it.target);
  if(h.act==="replay"&&it.type==="span"){ S.sel=[]; S.phase="present"; render(); presentSpan(it); return; }
  if(h.act==="reduce"&&it.options){ const want=new Set(it.type==="choice"?[it.answer]:(it.answer||it.seq||[])); const wr=it.options.map((_,i)=>i).filter(i=>!want.has(i)&&!S.off.includes(i)); shuffle(wr).slice(0,Math.ceil(wr.length/2)).forEach(i=>S.off.push(i)); }
  if(h.act==="boxes") S.boxes=true; if(h.act==="model") S.model=true;
  render();
}
function nextItem(skipped){
  const it=curItem(), S=PR.st, b=curBlock(); stopSpeak(); PR.cancelSpeak=true;
  b.res[PR.ii]={id:it.id,words:it.words||[],type:it.type,ok:S.grade!=null?S.grade>=5:(S.firstOk===null?null:S.firstOk),grade:skipped&&S.grade==null?null:S.grade,auto:S.auto?S.firstOk:null,hints:S.hintShown.length,rt:S.rt,memo:S.memo||"",skipped:!!skipped&&!S.answered&&S.grade==null};
  save();
  if(PR.ii+1<b.items.length){ PR.ii++; showItem(); return; }
  if(PR.bi+1<PR.sess.blocks.length){ PR.bi++; PR.ii=-1; render(); return; }

}
function finishSession(){ stopSpeak(); if(!PR) return; PR.sess.done=true; PR.sess.end=new Date(NOW()).toISOString();
  PR.sess.blocks=PR.sess.blocks.filter(b=>b.res.some(r=>r)); const p=PR.p; if(!PR.sess.blocks.length) p.sessions=p.sessions.filter(s=>s!==PR.sess);

/* ---------- 結果 ---------- */
let RESULT=null;
function blockStats(b){ const rs=(b.res||[]).filter(Boolean); const graded=rs.filter(r=>r.grade!=null||r.ok!=null);
  const okN=graded.filter(r=>r.grade!=null?r.grade>=5:r.ok).length; const rts=rs.filter(r=>r.rt!=null).map(r=>r.rt);
  return {n:rs.length,graded:graded.length,ok:okN,rate:graded.length?Math.round(okN/graded.length*100):null,hintItems:rs.filter(r=>r.hints>0).length,hints:rs.reduce((a,r)=>a+(r.hints||0),0),rt:rts.length?rts.reduce((a,x)=>a+x,0)/rts.length/1000:null,skip:rs.filter(r=>r.skipped).length}; }
function statTable(sess){ return `<table><tr><th>課題</th><th>level</th><th>問題数</th><th>正答率</th><th>ヒント</th><th>平均反応時間</th></tr>${sess.blocks.map(b=>{ const s=blockStats(b); return `<tr><td>${esc(b.skill)}<div class="muted small">${TYPE_JP[b.type]||""}</div></td><td>${b.level}</td><td>${s.n}${s.skip?`（スキップ${s.skip}）`:""}</td><td><b>${s.rate==null?"未判定":s.rate+"%"}</b>（${s.ok}／${s.graded}）</td><td>${s.hintItems}問で${s.hints}回</td><td>${s.rt==null?"－":s.rt.toFixed(1)+"秒"}</td></tr>`; }).join("")}</table>`; }
function vResult(){
  const p=P(); const s=RESULT||(p&&lastSession(p)); if(!s) return topBar("結果")+`<div class="wrap"><p>結果がありません。</p></div>`;
  return topBar("今日の結果")+`<div class="wrap"><div class="card"><h2>${fmtD(s.date)} の結果（${s.mode==="solo"?"ひとりで練習":"指導者と練習"}）</h2>${statTable(s)}
   <p class="muted small">正答率は段階6・5を正答として数えています。自動判定の課題は、最初の答えで判定しています（指導者が段階を直した場合はそれを使います）。</p></div>
   ${suggestHTML(p)}<div class="row"><button class="p" data-go="records">記録と推移を見る</button><button data-go="home">ホームへ</button></div></div>`+foot();
}
vResult.after=()=>bindSuggest();
function suggestions(p){
  const by={}; p.sessions.forEach(s=>(s.blocks||[]).forEach(b=>{ const st=blockStats(b); if(st.graded<3) return; (by[b.skill]=by[b.skill]||[]).push({date:s.date,level:b.level,rate:st.rate}); }));
  const out=[]; for(const [k,a] of Object.entries(by)){ if(a.length<2) continue; const x=a[a.length-2], y=a[a.length-1]; if(x.level!==y.level) continue;
    if(x.rate>=80&&y.rate>=80&&y.level<5) out.push({skill:k,from:y.level,to:y.level+1,why:`2回続けて正答率80%以上（${x.rate}%、${y.rate}%）`,up:true});
    if(x.rate<40&&y.rate<40&&y.level>1) out.push({skill:k,from:y.level,to:y.level-1,why:`2回続けて正答率40%未満（${x.rate}%、${y.rate}%）`,up:false}); }
  return out.filter(s=>effLevelNow(p,s.skill)===s.from);
}
function effLevelNow(p,skill){ if(p.lv[skill]!=null) return p.lv[skill]; const r=(recommend(p)||[]).find(r=>r.skills&&r.skills.some(x=>x.skill===skill)); return r?r.level:null; }
function suggestHTML(p){ if(!p) return ""; const sg=suggestions(p); if(!sg.length) return "";
  return `<div class="card"><h2>level の提案（決めるのは指導者です）</h2>${sg.map((s,i)=>`<div class="row"><span>${esc(s.skill)}：${s.why} → <b>level${s.from} を level${s.to} に${s.up?"上げる":"下げる"}</b>提案</span><button class="s" data-sg="${i}">${s.up?"上げる":"下げる"}</button></div>`).join("")}</div>`; }

/* ============================================================
   印刷用の教材
   ① 以前に作った教材（data/kyozai.js の一覧）を、成績の形が近い順におすすめする
   ② おすすめの課題から、A4の印刷用プリントをその場で作る
   作成：KENTA SHINKAWA
   ============================================================ */
var KYOZAI=[];
const KZ_GROUPS=["重症度別","パターン別","症状別","追加課題集","軽度向け"];
const KZ_OPEN={};
/* 近さ：入力してある項目ごとの差を2乗して平均し、平方根をとった値（ずれ）。大きくずれた項目ほど重く数える */
function kzDist(pct,prof){ if(!Array.isArray(prof)||!Array.isArray(pct)) return null; let s=0,n=0;
  for(let i=0;i<SLTA.length;i++){ const a=pct[i], b=prof[i]; if(a==null||b==null) continue; s+=(a-b)*(a-b); n++; }
  return n>=5?Math.sqrt(s/n):null; }
const kzNear=d=>d==null?"":d<10?"成績の形がとても近い":d<17?"成績の形が近い":d<25?"成績の形がやや近い":"成績の形は離れている";
function kzUsed(p,id){ return p&&p.kyozai&&Array.isArray(p.kyozai[id])?p.kyozai[id]:[]; }
function kzRecommend(p){
  const ev=latestEval(p); if(!ev||!KYOZAI.length) return null;

function buildAnswers(){ const box=$("#ppAns"); if(!box) return; box.innerHTML=""; let body=null;
  const newPage=()=>{ const d=document.createElement("div"); d.className="pp-sheet pp-ansp";
    d.innerHTML=ppHead("解答・読み上げリスト（指導者用）","この用紙はご本人に渡さないでください",true)+`<div class="pp-ask" style="font-size:11pt;font-weight:400">読み上げる文はここにだけ載せています。「読み上げ」の文を、ふつうの速さで1回読んでください。聞き返されたら、もう一度読んでかまいません。</div><div class="pp-body pa"></div>`+ppFoot();

function selftest(){
  const R=[]; const ok=(name,cond,info)=>R.push({name,pass:!!cond,info:info||""});
  // 1. 保存と読み込み（本来のキーを使い、終わったら元に戻す）
  const realKey="slta-train-v1"; let backup=null; try{ backup=localStorage.getItem(realKey); }catch(e){}
  KEY=realKey; DB=blankDB(); const tp=newPatient("T-001","テスト"); tp.evals.push({date:"2026-11-01",pct:DEMO_PCT.slice(),src:"テスト"}); DB.patients[tp.id]=tp; DB.current=tp.id;
  tp.lv["呼称"]=3; tp.sessions.push({id:"x",date:"2026-11-02",mode:"teacher",done:true,blocks:[{skill:"呼称",level:3,type:"say",items:[],res:[{id:"gen-name-f01",grade:6,ok:true,hints:1,rt:2000}]}]});
  const before=JSON.stringify(DB); save(); DB=null; load(); const after=JSON.stringify(DB);
  ok("保存してから読み直すと同じ内容になる（キー slta-train-v1）",before===after,`${before.length}文字`);
  ok("読み直した対象者の記録（評価・level・訓練記録）",DB.patients["T-001"]&&DB.patients["T-001"].evals.length===1&&DB.patients["T-001"].lv["呼称"]===3&&DB.patients["T-001"].sessions.length===1);
  try{ if(backup===null) localStorage.removeItem(realKey); else localStorage.setItem(realKey,backup); }catch(e){}
  // 2. 最近出した語を避ける
  KEY="slta-train-selftest"; DB=blankDB(); const p=newPatient("T-002"); DB.patients[p.id]=p; DB.current=p.id;
  let t=Date.parse("2026-11-01T10:00:00"); NOW=()=>t;
  const pool=poolAt(GEN.name.pool(),3,4); const half=Math.floor(pool.length/2);
  const A=makeItems(p,{skill:"呼称",level:3,n:half}); A.forEach(it=>markUsed(p,it)); t+=7*86400000;
  const B=makeItems(p,{skill:"呼称",level:3,n:half}); B.forEach(it=>markUsed(p,it)); t+=7*86400000;
  const tg=x=>x.stim.pic; const sA=new Set(A.map(tg)), sB=B.map(tg);
  ok(`呼称：1週目と2週目で同じ語が出ない（語${pool.length}個から${half}問ずつ）`,sB.every(x=>!sA.has(x)),`1週目 ${[...sA].join(",")} ／ 2週目 ${sB.join(",")}`);
  const C=makeItems(p,{skill:"呼称",level:3,n:half}); const sC=C.map(tg); const setB=new Set(sB);
  ok("使い切ったら古い順に再利用（3週目は2週目の語を出さず、1週目の語か未使用の問題から）",sC.every(x=>!setB.has(x))&&new Set(sC).size===sC.length,`3週目 ${sC.join(",")}`);
  t+=29*86400000; const ctxT={p,sess:new Set()}; const D=nounsPic().slice(0,8).map(t0=>GEN.listen.make(ctxT,t0,2)); ok("聴理解（アプリが作る問題）：選択肢の数が level2 で3つ",D.length&&D.every(it=>it.options.length===Math.min(3,nounsPic().length)),D.map(it=>it.id+":"+it.options.map(o=>o.pic).join("/")).join(" "));
  // 問題データの問題ID
  const bs=Object.values(SKILLS).find(s=>!s.gen&&s.bank.filter(x=>x.level===s.bank[0].level).length>=2);
  if(bs){ const L=bs.bank[0].level; const n=bs.bank.filter(x=>x.level===L).length; const X=makeItems(p,{skill:bs.name,level:L,n:1}); X.forEach(it=>markUsed(p,it)); t+=86400000; const Y=makeItems(p,{skill:bs.name,level:L,n:1});
    ok(`問題データ（${bs.name}）：前回出した問題IDを後回しにする`,X[0]&&Y[0]&&X[0].id!==Y[0].id,`${X[0]&&X[0].id} → ${Y[0]&&Y[0].id}`); }
  // 3. メニュー
  p.evals.push({date:"2026-11-01",pct:DEMO_PCT.slice(),src:"テスト"});
  let menuOk=true, menuInfo=""; for(let k=0;k<20;k++){ const m=buildMenu(p,false,4); const ty=m.map(b=>SKILLS[b.skill].type);
    if(m.length<3||m.length>5) menuOk=false; for(let i=1;i<ty.length;i++) if(ty[i]===ty[i-1]&&new Set(Object.values(SKILLS).map(s=>s.type)).size>2) menuOk=false; if(!m.some(b=>b.strong)) menuOk=false; if(k===0) menuInfo=m.map(b=>`${b.skill}(${SKILLS[b.skill].type})L${b.level}×${b.n}`).join(" / "); }
  ok("メニュー：3〜5ブロック、同じ形が続かない、得意な課題が1つ入る（20回試行）",menuOk,menuInfo);
  const ms=buildMenu(p,true,4); ok("ひとりで練習：自動で正誤が分かる課題だけ",ms.length&&ms.every(b=>AUTO.has(SKILLS[b.skill].type)),ms.map(b=>b.skill).join(" / "));
  // 4. 生成した問題の形
  const errs=[]; let made=0; for(const g of Object.values(GEN)){ if(!SKILLS[g.name]) continue; for(let L=1;L<=5;L++){ const its=makeItems(p,{skill:g.name,level:L,n:3}); its.filter(it=>it.gen).forEach(it=>{ made++;
    if(!it.id||!it.prompt) errs.push(it.id+" id/prompt"); if(it.type==="choice"&&!(it.answer>=0&&it.answer<it.options.length)) errs.push(it.id+" answer");
    if(it.options&&new Set(it.options.map(o=>o.pic||o.text)).size!==it.options.length) errs.push(it.id+" 選択肢が重複");
    if(it.options&&it.options.some(o=>o.pic&&!PICS[o.pic])) errs.push(it.id+" 絵なし");
    if(it.options){ const ps=it.options.map(o=>o.pic).filter(Boolean); for(let i=0;i<ps.length;i++) for(let j=i+1;j<ps.length;j++) if(conflict(ps[i],ps[j])) errs.push(it.id+` 一緒に出さない組 ${ps[i]}・${ps[j]}`); }
    if((it.type==="say"||it.type==="write")&&!it.target) errs.push(it.id+" target");
    if(/[0-9]/.test(it.speak||"")&&it.type!=="input") errs.push(it.id+" 読み上げに数字"); }); } }
  ok(`アプリが作る問題の形（${made}問）`,!errs.length,errs.slice(0,8).join(" ／ "));
  // 4b. 一緒に出さない組（同じ読み・正解が2つ・似た絵）が選択肢に並ばない：全部の語×全 level で直接作って調べる
  { const bad=[]; let cnt=0; const cx={p:newPatient("T-003"),sess:new Set()};
    for(const g of Object.values(GEN)){ if(!SKILLS[g.name]||g.kana||g.calc) continue; for(const t0 of g.pool()) for(let L=1;L<=5;L++){ let it=null; try{ it=g.make(cx,t0,L); }catch(e){ bad.push(g.k+" "+t0+" エラー "+e.message); }
      if(!it) continue; cnt++; const ps=(it.options||[]).map(o=>o.pic).filter(Boolean); const tx=(it.options||[]).map(o=>o.text).filter(Boolean);
      for(let i=0;i<ps.length;i++) for(let j=i+1;j<ps.length;j++) if(conflict(ps[i],ps[j])) bad.push(`${it.id} ${ps[i]}・${ps[j]}`);
      if(new Set(tx).size!==tx.length) bad.push(it.id+" 文字の選択肢が重複");
      if(it.type==="choice"&&!(it.answer>=0&&it.answer<it.options.length)) bad.push(it.id+" answer"); } }
    ok(`一緒に出さない組が選択肢に並ばない（${cnt}問を作って確認）`,!bad.length,bad.slice(0,10).join(" ／ ")); }
  // 5. プロフィールツールの取り込み
  const pr=parseProfile(DEMO_PROFILE); const it0=pr.items[0];
  ok("取り込み：段階の列「6655432xxx」→40%、まんが段階3→40%、計算9→45%",pr.items.length===2&&it0.pct[0]===40&&it0.pct[7]===40&&it0.pct[25]===45,JSON.stringify(it0&&it0.pct));
  const pr2=parseProfile(JSON.stringify({version:2,patients:{a:{fmt:5,name:"数値",dates:["2026-01-01"],scores:[[35,null,80].concat(Array(23).fill(null))]}}}));
  ok("取り込み：正答率（数値）・未入力 null",pr2.items.length===1&&pr2.items[0].pct[0]===35&&pr2.items[0].pct[1]===null&&pr2.items[0].pct[2]===80);
  ok("SLTA入力：「6655432166」→60%、「#8」→80%、「35」→35%",Math.round(parseScore("6655432166",0).v)===60&&Math.round(parseScore("#8",0).v)===80&&parseScore("35",0).v===35);
  // 6. 印刷用の教材（以前の教材のおすすめ）
  if(KYOZAI.length){ const kp=newPatient("T-004"); kp.evals.push({date:"2026-11-01",pct:[100,100,100,100,100,100,100,100,100,93,100,100,100,100,100,100,100,90,100,100,80,100,100,100,100,100],src:"テスト"});
    const R1=kzRecommend(kp); ok("おすすめの教材：軽度の健忘失語に近い成績 → 1位が健忘失語（軽度）、対の追加課題集も出る",R1&&R1.top[0].k.id==="05-3_健忘失語_軽度"&&R1.next.some(x=>x.k.id==="05-3_健忘失語_軽度_追加"),R1&&R1.top.map(x=>x.k.id+":"+x.d.toFixed(1)).join(" / "));
    kp.kyozai["05-3_健忘失語_軽度"]=["2026-11-02"]; const R2=kzRecommend(kp); ok("使用済みの教材は後ろへ回る",R2&&R2.top[0].k.id!=="05-3_健忘失語_軽度",R2&&R2.top.map(x=>x.k.id).join(" / "));
    const sp=newPatient("T-005"); sp.evals.push({date:"2026-11-01",pct:[20,10,10,10,10,20,10,0,0,7,20,10,10,0,30,10,10,0,10,0,0,10,0,0,0,20],src:"テスト"}); const R3=kzRecommend(sp);
    ok("おすすめの教材：重度の成績 → 上位3冊が重度・最重度の教材",R3&&R3.top.slice(0,3).every(x=>/重度|最重度|全失語/.test(x.k.title)&&!/軽度|中等度/.test(x.k.title)),R3&&R3.top.map(x=>x.k.id+":"+x.d.toFixed(1)).join(" / ")); }
  // 7. 印刷用プリント：枚数・紙で使える形・読み上げ文が課題用紙に出ない
  { const set=buildPrint(p,5); const sheets=set?set.sheets:[];
    const leak=[]; sheets.forEach((s,i)=>{ const html=ppSheet(s,i,sheets.length); const optT=new Set([].concat(...s.items.map(it=>(it.options||[]).map(o=>o&&o.text).filter(Boolean))));
      s.items.forEach(it=>{ const rd=paperRead(it); if(rd&&rd.length>=3&&!optT.has(rd)&&html.includes(esc(rd))) leak.push(it.id); }); }); // 選択肢の文字そのものは除く
    ok("印刷用プリント：課題用紙5枚、すべて紙で使える形、読み上げ文は課題用紙に出ない",sheets.length===5&&sheets.every(s=>s.items.length&&s.items.every(paperOK))&&!leak.length,sheets.map(s=>`${s.skill}L${s.level}×${s.items.length}`).join(" / ")+(leak.length?" 漏れ："+leak.join(","):"")); }
  ok("JavaScript のエラーがない",!ERRS.length,ERRS.join(" / "));
  NOW=()=>Date.now();
  const pass=R.every(r=>r.pass);
  console.log("SELFTEST "+(pass?"PASS":"FAIL")+" "+JSON.stringify(R));
  document.getElementById("app").innerHTML=`<div class="top"><h1>言語訓練</h1><span class="who">セルフテスト</span></div><div class="wrap"><div class="card"><h2 id="stRes">${pass?"すべて合格":"不合格があります"}</h2><table>${R.map(r=>`<tr><td>${r.pass?"合格":"<b class='err'>不合格</b>"}</td><td>${esc(r.name)}<div class="muted small">${esc(r.info)}</div></td></tr>`).join("")}</table></div></div>`+foot();
}
function checkPersist(mode){ // 2回に分けて開き、保存→再読み込みを確かめる
  KEY="slta-train-v1"; load(); let msg;
  if(mode==="save"){ const p=DB.patients["CHK-1"]||newPatient("CHK-1","保存確認"); DB.patients[p.id]=p; DB.current=p.id; p.evals=[{date:"2026-11-20",pct:DEMO_PCT.slice(),src:"確認"}];
    const menu=buildMenu(p,true,3); startSession(p,menu,"solo"); PR.ii=0; showItem(); const it=curItem(); if(it.type==="choice") onOpt(it.answer); nextItem(false); finishSession();
    msg=`保存しました：対象者 CHK-1、訓練記録 ${p.sessions.length}回、出した問題ID ${Object.keys(p.usedQ).length}件、語 ${Object.keys(p.usedW).length}件`; }
  else { const p=DB.patients["CHK-1"]; msg=p?`読み込めました：対象者 CHK-1、評価 ${p.evals.length}回、訓練記録 ${p.sessions.length}回、出した問題ID ${Object.keys(p.usedQ).join(",")}`:"見つかりません（保存されていません）"; }
  console.log("PERSIST "+mode+" "+msg);
  document.getElementById("app").innerHTML=`<div class="wrap"><div class="card"><h2 id="pmsg">${esc(msg)}</h2></div></div>`;
}

/* ---------- はじまり ---------- */
function boot(){
  KYOZAI=Array.isArray(window.KYOZAI)?window.KYOZAI.filter(k=>k&&typeof k==="object"&&k.id):[];
  PICS=window.PICS||{}; WORDS=window.WORDS||{}; BANK=Array.isArray(window.BANK)?window.BANK.filter(x=>x&&typeof x==="object"):[];
  for(const id of Object.keys(WORDS)) if(!WORDS[id]||typeof WORDS[id]!=="object") delete WORDS[id];
  buildSkills(); pickVoice(); try{ speechSynthesis.onvoiceschanged=pickVoice; }catch(e){}
  const qs=new URLSearchParams(location.search);
  if(qs.get("selftest")){ DB=blankDB(); selftest(); return; }
  if(qs.get("check")){ checkPersist(qs.get("check")); return; }
  if(qs.get("demo")){ runDemo(qs.get("demo")); return; }
  load(); applySettings();
  const h=(location.hash||"").slice(1); SCREEN=h&&h!=="practice"&&h!=="result"?h:"home"; history.replaceState(null,"","#"+SCREEN); render();
}
loadData(0);
